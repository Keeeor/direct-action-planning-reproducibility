# Isolated Metrics Server installation for the prototype's native HPA baseline.
# APIService is cluster-scoped by Kubernetes design; all workload reads remain
# limited to the selected single-node test cluster and prototype namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dap-prototype-metrics-server
  namespace: dap-k8s-prototype
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:dap-prototype-metrics-server
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/proxy"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: system:dap-prototype-metrics-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:dap-prototype-metrics-server
subjects:
  - kind: ServiceAccount
    name: dap-prototype-metrics-server
    namespace: dap-k8s-prototype
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dap-prototype-metrics-server-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: dap-prototype-metrics-server
    namespace: dap-k8s-prototype
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dap-prototype-metrics-server-auth-reader
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: dap-prototype-metrics-server
    namespace: dap-k8s-prototype
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dap-prototype-metrics-server
  namespace: dap-k8s-prototype
  labels:
    app.kubernetes.io/name: dap-prototype-metrics-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dap-prototype-metrics-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dap-prototype-metrics-server
    spec:
      serviceAccountName: dap-prototype-metrics-server
      containers:
        - name: metrics-adapter
          # This local image exposes real worker process CPU/memory through the
          # standard metrics.k8s.io PodMetrics API. It is not a mock source.
          image: dap-k8s-service:local
          imagePullPolicy: IfNotPresent
          command: ["uvicorn"]
          args:
            - metrics_adapter.main:app
            - --host=0.0.0.0
            - --port=4443
            - --ssl-certfile=/tls/tls.crt
            - --ssl-keyfile=/tls/tls.key
          env:
            - name: METRICS_TARGET_NAMESPACE
              value: dap-k8s-prototype
            - name: METRICS_TARGET_LABEL_SELECTOR
              value: app.kubernetes.io/name=dap-worker
            - name: METRICS_TARGET_PORT
              value: "8000"
            - name: METRICS_SAMPLE_INTERVAL_SECONDS
              value: "2"
          ports:
            - name: https
              containerPort: 4443
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: dap-prototype-metrics-adapter-tls
---
apiVersion: v1
kind: Service
metadata:
  name: dap-prototype-metrics-server
  namespace: dap-k8s-prototype
spec:
  selector:
    app.kubernetes.io/name: dap-prototype-metrics-server
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta1.metrics.k8s.io
  labels:
    app.kubernetes.io/part-of: dap-k8s-prototype
spec:
  service:
    name: dap-prototype-metrics-server
    namespace: dap-k8s-prototype
  group: metrics.k8s.io
  version: v1beta1
  insecureSkipTLSVerify: true
  groupPriorityMinimum: 100
  versionPriority: 100
