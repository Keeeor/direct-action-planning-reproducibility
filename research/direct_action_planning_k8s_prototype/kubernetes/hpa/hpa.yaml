apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dap-worker-hpa
  namespace: dap-k8s-prototype
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dap-worker
  minReplicas: 1
  maxReplicas: 5
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 10
    scaleDown:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
