apiVersion: apps/v1
kind: Deployment
metadata:
  name: dap-worker
  namespace: dap-k8s-prototype
  labels:
    app.kubernetes.io/name: dap-worker
    app.kubernetes.io/part-of: dap-k8s-prototype
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dap-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dap-worker
        app.kubernetes.io/part-of: dap-k8s-prototype
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: worker
          image: dap-k8s-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: SERVICE_PROFILE
              value: azure_http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 96Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true

