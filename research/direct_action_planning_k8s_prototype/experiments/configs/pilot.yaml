schema: dap.k8s.matrix_config.v1
mode: pilot
source_split: validation
horizon_steps: 32
control_interval_seconds: 10
repetitions: 3
seeds: [20260825, 20260838, 20260859]
methods: [static, threshold, hpa, keda, mpc_4, dap]
budgets:
  low: 256
  medium: 512
  high: 832
max_attempts: 2
kubernetes:
  context: kind-rl-lab
  namespace: dap-k8s-prototype
  deployment: dap-worker
  image: dap-k8s-service:local
controller_defaults:
  horizon_steps: 32
  control_interval_seconds: 10
  base_replicas: 1
  native_scale_down_reserve_seconds: 45
paths:
  system_model: ../../results/calibration/system_model.json
  plan_root: ../../results/request_plans/pilot
  run_root: ../../results/runs/pilot
actions:
  no_op: 1
  scale_small: 2
  scale_medium: 3
  scale_large: 5
profiles:
  azure_http:
    dataset: azure2019
    domain: http
    checkpoint: ../../results/prototype_checkpoints_v3/azure_http/models.pt
    slo_seconds: 0.25
    capacity_per_pod_rps: 233.90924048217514
    target_peak_rps: 300
    max_rps: 480
    training_quantile: 0.99
    activity_window_quantiles: [0.6, 0.8, 1.0]
  gentd_inference:
    dataset: gentd26
    domain: txt2img
    checkpoint: ../../results/prototype_checkpoints_v3/gentd_inference/models.pt
    slo_seconds: 1.0
    capacity_per_pod_rps: 29.97526124225415
    target_peak_rps: 80
    max_rps: 140
    training_quantile: 0.99
    activity_window_quantiles: [0.6, 0.8, 1.0]
workload:
  azure_http:
    client_timeout_seconds: 10
    connection_limit: 512
  gentd_inference:
    client_timeout_seconds: 15
    connection_limit: 512
monitor:
  interval_seconds: 1
baseline_parameters:
  static_replicas: 2
  threshold:
    queue_small: 8
    queue_medium: 32
    queue_large: 96
