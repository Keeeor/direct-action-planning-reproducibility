tier: dp_validation
device: cpu
torch_threads: 1
environment:
  horizon: 16
  max_budget: 12
  max_queue: 6
  gamma: 0.99
  action_costs: [0.0, 1.0, 2.0, 3.0]
training:
  total_steps: 20480
  rollout_steps: 256
  learning_rate: 0.0003
  update_epochs: 4
  minibatch_size: 128
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  value_coef: 0.5
  cost_value_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5
  global_lambda_lr: 0.05
  hidden_dim: 64
  q_value_coef: 0.5
evaluation_episodes: 40
scenarios: [early_burst, late_burst]
budgets: [4, 8, 12]
seeds: [0, 1, 2, 3, 4]
methods: [b4_budget_state, cdba, dsp_a, dsp_b]
dsp:
  alpha: 1.0
  delta_budget_ratio: 0.125
  monotonic_coef: 0.1
  actor_use_budget_state: true
  actor_use_horizon: true
