[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "direct-action-planning-reproducibility"
version = "0.1.0"
description = "Anonymous reproduction package for Direct Action Planning under finite budgets"
requires-python = ">=3.11"
dependencies = [
  "gymnasium>=0.29,<1",
  "matplotlib>=3.8",
  "numpy>=2.0",
  "pandas>=2.2",
  "PyYAML>=6.0",
  "scipy>=1.13",
  "torch>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
